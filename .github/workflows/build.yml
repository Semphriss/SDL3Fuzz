name: build
on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request: {}
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Patch and compile SDL
        run: |
          sudo apt-get install -y build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev \
            libpulse-dev  libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev  libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev  libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev  libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev
          sudo apt-get remove -y libsdl3-dev || true
          cd ~
          git clone -b release-3.4.8 https://github.com/libsdl-org/SDL.git SDL3
          cd SDL3
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build . --parallel
          sudo cmake --install .

      - name: Compile SDL3Fuzz
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DSDL3FUZZ_BUILD_EXAMPLES=ON
          cmake --build . --parallel

      - name: Test SDL3Fuzz
        env:
          SDLFUZZ_MAX_DELAY_MS: 0
          SDLFUZZ_SEED: 0
          SDLFUZZ_LOGLEVEL: 1
        run: |
          LD_PRELOAD=$PWD/build/libsdl3fuzz.so ./build/examples/basic || code=$?
          test "$code" -eq "136"
